[package]
name = "terrain-test"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30.13"
wgpu = {
	version = "30.0.2",
	default-features = false,
	features = ["vulkan", "metal", "wgsl"]
}
anyhow = "1.0.104"

[profile.release]
debug = false
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
