[package]
name = "terrain-test"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30.13"
wgpu = {
	version = "30.0.2",
	default-features = false,
	features = ["vulkan", "metal", "wgsl"]
}
bytemuck = {
	version = "1.25.2",
	features = ["derive"]
}
pollster = "1.0.1"
glam = "0.34.3"
anyhow = "1.0.104"
log = "0.4.35"
env_logger = "0.11.11"

[profile.release]
debug = false
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
